# djogi-allow-secret-file: local dev cluster fixture; the `djogi:djogi`
# credentials are intentionally weak, not production, and never accept remote
# connections (no ports bound on a public interface). See `cargo xtask
# check-secrets` for the scanner that consults this marker.
services:
  postgres:
    image: postgis/postgis:18-3.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: djogi
      POSTGRES_PASSWORD: djogi
      POSTGRES_DB: djogi_test
    volumes:
      - djogi_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djogi"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  djogi_pgdata:
