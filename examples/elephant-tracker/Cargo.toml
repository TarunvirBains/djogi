[package]
name = "elephant-tracker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Runnable Djogi example: tracking African elephant herds across borders."

[dependencies]
djogi = { path = "../../djogi", features = ["spatial", "outbox"] }
heeranjid = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Phase 8-Zero T7: dropped the direct `tokio-postgres` dep — `migrate.rs`
# now reaches the underlying client through `DjogiPool::with_client`,
# the framework's escape hatch for raw-driver operations. The
# `&mut tokio_postgres::Client` argument inside the closure resolves
# transitively through Djogi's re-export.
postgres-types = "0.2"
time = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
