[package]
name = "elephant-tracker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Runnable Djogi example: tracking African elephant herds across borders."

[dependencies]
# Cluster D additions consume framework surfaces that are all in
# djogi's core (no new feature flag): `Model::materialize_closure`
# (Cluster B substrate), `tree_descendants(edge, root_id)` +
# `search_breadth_first_by` / `search_depth_first_by` (Cluster B
# typed walks), and the `ElephantAncestry` `ClosureModel` impl.
# The mating-pairs demo's PostGIS calls (`ST_ConvexHull`,
# `ST_Intersection`, `ST_Area`) reach the database directly via
# `ctx.raw_rows`; the typed Cluster C surface emits the same SQL
# but is bolted to `AnnotatedQuerySet<T, A>` over a single Model
# (#84) so the multi-CTE pair-shape mating-pairs query couldn't
# use it. `spatial` is still required because `Sighting.location`
# is a `GeoPoint` field and the GiST index is feature-gated; T26
# verification confirmed the pre-Cluster-D feature set covers
# everything Cluster D adds.
djogi = { path = "../../djogi", features = ["spatial", "outbox"] }
heeranjid = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `migrate.rs` reaches the underlying client through the
# `RawPoolAccessExt::raw_with_client` raw-driver bypass on
# `DjogiPool` — the framework's escape hatch for COPY, cold-start
# DDL, and third-party `&tokio_postgres::Client` bridges. The
# `&mut tokio_postgres::Client` argument inside the closure resolves
# transitively through Djogi's re-export — no direct tokio-postgres dep
# needed.
postgres-types = "0.2"
time = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
