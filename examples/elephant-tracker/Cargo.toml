[package]
name = "elephant-tracker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Runnable Djogi example: tracking African elephant herds across borders."

[dependencies]
djogi = { path = "../../djogi", features = ["spatial", "fts", "outbox"] }
heeranjid = { version = "0.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
time = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
djogi = { path = "../../djogi", features = ["spatial", "fts", "outbox", "test"] }
