[package]
name = "djogi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Model-first web framework for Rust — web-framework-agnostic core; Axum integration opt-in via the `axum` feature flag"
documentation = "https://docs.rs/djogi"
readme = "../ReadMe.MD"
keywords = ["orm", "postgres", "web-framework", "model", "migrations"]
categories = ["database", "web-programming", "asynchronous"]

[features]
# auth-argon2 — enables PasswordHash::hash (Argon2id hashing) and the
# constant-time verify path. Without this flag, PasswordHash::verify always
# returns false and PasswordHash::hash is not available.
auth-argon2 = ["dep:argon2", "dep:password-hash"]

# outbox — worker-side primitives: claim_pending, mark_published, mark_failed,
# recover_stale, the Publisher trait, and the reference NotifyPublisher.
# The write side (emit_event) is always compiled; only the worker / consumer
# side is behind this flag.
outbox = []

# outbox-redis — Redis publisher stub. Depends on outbox being enabled.
# The actual `redis` crate dependency ships in a future task when the full
# integration is built; today the stub body is unimplemented!().
outbox-redis = ["outbox"]

# outbox-kafka — Kafka publisher stub (via rdkafka). Same deferral as Redis.
outbox-kafka = ["outbox"]

# outbox-nats — NATS publisher stub (via async-nats). Same deferral.
outbox-nats = ["outbox"]

# spatial — gates the GeoPoint primitive and the spatial query surface
# (SpatialExpr, within_km, order_by_distance). Requires PostGIS installed
# in the target Postgres database; no extra Rust dependencies are pulled in
# today because the EWKB codec is implemented with stdlib byte primitives.
spatial = []

# testing — exposes djogi::testing::setup_test_db and related helpers in
# non-test builds (e.g. for integration test harnesses that can't use
# cfg(test)).
testing = []

[dependencies]
argon2 = { version = "0.5", optional = true, features = ["std"] }
# password-hash is an indirect dep of argon2. Listing it here so we can enable
# the `getrandom` feature, which activates `rand_core/getrandom` and exposes
# `rand_core::OsRng` for use in `PasswordHash::hash`.
password-hash = { version = "0.5", optional = true, features = ["getrandom"] }
djogi-macros.workspace = true
indexmap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
heeranjid.workspace = true
# sassi — sibling Rust crate providing the universal predicate algebra
# (`BasicPredicate<T>`), the typed in-memory pool (`Punnu<T>`), and
# cross-runtime trait queries. Path-dep during 8γ–8ε so djogi iterates
# against in-flight sassi fixes; flips to `version = "0.1"` from crates.io
# at Cluster 8η T13. `watermark-time` opts the `time`-crate-backed
# `MonotonicWatermark` impl in (matches djogi's `time` crate baseline);
# default features (`serde`, `runtime-tokio`) stay enabled.
sassi = { path = "../sassi-reference/sassi", features = ["watermark-time"] }
tokio-postgres.workspace = true
postgres-types.workspace = true
deadpool-postgres.workspace = true
bytes.workspace = true
inventory.workspace = true
figment.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
async-trait.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
libc.workspace = true
phf.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
figment = { workspace = true, features = ["test"] }
trybuild.workspace = true
rust_decimal_macros.workspace = true
tracing-test = "0.2"

[[bin]]
name = "djogi-outbox-relay"
path = "src/bin/djogi-outbox-relay.rs"
required-features = ["outbox"]

