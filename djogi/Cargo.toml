# OOB-rejection assertions construct DATE/TIMESTAMP literals at years
# outside the `time` crate's default ±9999 range, which the typed Rust
# surface cannot produce. Exercises `raw_execute` through the bypass
# attribute to prove the CHECK rejects external OOB writes.
