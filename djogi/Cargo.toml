[package]
name = "djogi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Model-first web framework for Rust, built on Axum"

[dependencies]
djogi-macros.workspace = true
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
heeranjid.workspace = true
heeranjid-sqlx.workspace = true
inventory.workspace = true
figment.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["migrate"] }
figment = { workspace = true, features = ["test"] }
heeranjid-sqlx = { workspace = true }
trybuild.workspace = true

[[test]]
name = "integration"
path = "../tests/integration/smoke.rs"
harness = true

[[test]]
name = "phase1_model"
path = "../tests/integration/phase1_model.rs"
harness = true
