name = "temporal_year_check"
path = "../tests/internal/temporal_year_check.rs"
harness = true

# Narrow/unsigned integer type-derived CHECK (closes #190, #186).
# Round-trips boundary values for i8/u8/u16/u32/u64 through the typed surface and
# verifies OOB rejection via type-derived CHECK constraints. OOB-rejection assertions
# use `raw_execute` through the bypass attribute (values unreachable via the typed
# surface, e.g. SMALLINT 256 for u8, fractional 1.5 for u64 NUMERIC). The u64 tests
# also verify the integrality CHECK (`col = trunc(col)`) introduced when u64 was
# moved from NUMERIC(20,0) to bare NUMERIC to prevent silent rounding of fractional
# inputs before CHECK evaluation.
[[test]]
name = "integer_widening"
path = "../tests/internal/integer_widening.rs"
harness = true

# Adopter `#[field(check)]` (#105) and Decimal
# structural CHECK projection (#188). Exercises:
#   - Decimal round-trip across the rust_decimal representable range.
#   - Raw-NUMERIC OOB rejection for scale > 28 and coefficient > 2^96 - 1.
#   - Adopter `#[field(check = "...")]` accept/reject through the typed
#     surface for fields without a type-derived CHECK (f64 / DOUBLE PRECISION).
#   - Combined type-derived + adopter CHECK on a `u32` column: both clauses
#     enforced via the projection layer's AND-merge into a single constraint.
#   - Catalog assertions on the deployed constraint expressions (pg_get_constraintdef).
# OOB-rejection cases need raw_execute because rust_decimal cannot construct
