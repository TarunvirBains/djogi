[package]
name = "djogi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Model-first web framework for Rust — web-framework-agnostic core; Axum integration opt-in via the `axum` feature flag"

[dependencies]
djogi-macros.workspace = true
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
heeranjid.workspace = true
heeranjid-sqlx.workspace = true
inventory.workspace = true
figment.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["migrate"] }
figment = { workspace = true, features = ["test"] }
heeranjid-sqlx = { workspace = true }
trybuild.workspace = true
rust_decimal_macros.workspace = true

[[test]]
name = "integration"
path = "../tests/integration/smoke.rs"
harness = true

[[test]]
name = "phase1_model"
path = "../tests/integration/phase1_model.rs"
harness = true

[[test]]
name = "phase2_queryset"
path = "../tests/integration/phase2_queryset.rs"
harness = true

[[test]]
name = "phase3_relations"
path = "../tests/integration/phase3_relations.rs"
harness = true

[[test]]
name = "phase4_transactions_expressions"
path = "../tests/integration/phase4_transactions_expressions.rs"
harness = true

[[test]]
name = "phase4_5_projections"
path = "../tests/integration/phase4_5_projections.rs"
harness = true

[[test]]
name = "djogi_test_smoke"
path = "../tests/integration/djogi_test_smoke.rs"
harness = true
