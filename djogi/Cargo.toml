[package]
name = "djogi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Model-first web framework for Rust — web-framework-agnostic core; Axum integration opt-in via the `axum` feature flag"
documentation = "https://docs.rs/djogi"
readme = "../ReadMe.MD"
keywords = ["orm", "postgres", "web-framework", "model", "migrations"]
categories = ["database", "web-programming", "asynchronous"]

[features]
# auth-argon2 — enables PasswordHash::hash (Argon2id hashing) and the
# constant-time verify path. Without this flag, PasswordHash::verify always
# returns false and PasswordHash::hash is not available.
auth-argon2 = ["dep:argon2", "dep:password-hash"]

# outbox — worker-side primitives: claim_pending, mark_published, mark_failed,
# recover_stale, the Publisher trait, and the reference NotifyPublisher.
# The write side (emit_event) is always compiled; only the worker / consumer
# side is behind this flag.
outbox = []

# outbox-redis — Redis publisher stub. Depends on outbox being enabled.
# The actual `redis` crate dependency ships in a future task when the full
# integration is built; today the stub body is unimplemented!().
outbox-redis = ["outbox"]

# outbox-kafka — Kafka publisher stub (via rdkafka). Same deferral as Redis.
outbox-kafka = ["outbox"]

# outbox-nats — NATS publisher stub (via async-nats). Same deferral.
outbox-nats = ["outbox"]

# notify — gates the in-process model-event NOTIFY surface: the synchronous
# publisher hook in `emit_event` (fires `pg_notify('djogi_<table>',
# '{kind,id}')` alongside the outbox INSERT) and the
# `djogi::notify::subscribe::<M>()` consumer surface backed by a per-pool
# `PgListener` background task.
#
# Distinct from the `outbox` feature flag: `outbox` gates worker-side
# primitives + downstream relay publishers (full-payload, user-named
# channels). `notify` is the in-process subscription path with a slim
# `{kind, id}` payload on `djogi_<table>` channels — designed for cache
# invalidation use cases where the receiver re-fetches the full row by id.
notify = []

# spatial — gates the GeoPoint primitive and the spatial query surface
# (SpatialExpr, within_km, order_by_distance). Requires PostGIS installed
# in the target Postgres database; no extra Rust dependencies are pulled in
# today because the EWKB codec is implemented with stdlib byte primitives.
spatial = []

# network — gates the typed Postgres network-type surface
# (djogi#213, part of the djogi#170 typed-Postgres-coverage umbrella):
#
# - `std::net::IpAddr` → `INET` (via the always-on `postgres-types`
#   `IpAddr` `ToSql` / `FromSql` impls; netmask defaults to /32 or /128 —
#   the host-address case).
# - `djogi::CidrAddr { addr, prefix }` → `CIDR` (typed newtype with a
#   hand-rolled wire codec — no third-party crate dependency for the
#   `cidr` family).
# - `djogi::MacAddr([u8; 6])` → `MACADDR` (typed newtype with a
#   hand-rolled wire codec — no `eui48` / `mac_address` dep).
#
# All three column types ship behind this single feature flag. The
# descriptor variants (`FieldSqlType::Inet` / `Cidr` / `Macaddr`) are
# always present so the migration differ / docs / `Display` surface
# stays stable across feature states; only the Rust newtypes, ToSql /
# FromSql impls, `FilterValue` carrier variants, `IntoFilterValue` impls
# and `DjogiField` helper methods are feature-gated. Adopters with the
# feature off who declare `pub addr: IpAddr` / `pub net: CidrAddr` /
# `pub mac: MacAddr` get an "unresolved type" compile error at the model
# struct, not a macro-level error — matching the spatial flag pattern.
network = []

# trgm — gates the pg_trgm typed surface on text columns:
#
# - `f.col().explicit_pg_predicate().trgm_similar_to(pattern)` — a WHERE-
#   clause predicate that compiles to the `%` operator, which gin_trgm_ops /
#   gist_trgm_ops index opclasses accelerate. Threshold is the session GUC
#   `pg_trgm.similarity_threshold` (Postgres default 0.3); there is no per-
#   call numeric-threshold argument. Postgres-specific — not evaluable in
#   Punnu's in-memory cache. Reached via `.explicit_pg_predicate()`, the same
#   pattern as `regex` / `iregex`.
#
# - `f.col().trgm_similarity(pattern)` — a scored `Expr<f64>` evaluating
#   `similarity(col, $pattern)` per row. Compose with the `Expr<T>` comparison
#   API inside `filter_expr` for a per-query numeric threshold (e.g.
#   `.gte(Expr::literal(0.5_f64))`). NOT index-accelerated by the trgm
#   opclasses. Using the score in `order_by` or as an `annotate` payload is a
#   framework gap — generic-Expr integration on OrderExpr / AnnotationSlot
#   does not yet exist; see docs/guide/trgm.md#limitations-and-future-work.
#
# Requires `pg_trgm` installed in the target Postgres database:
#
#   CREATE EXTENSION IF NOT EXISTS pg_trgm;
#
# No extra Rust dependencies are pulled in — the trigram logic runs entirely
# server-side via Postgres. The only adopter change required is enabling this
# feature flag.
#
# For index acceleration, declare a GIN index with `gin_trgm_ops` opclass on
# the column (see docs/guide/trgm.md for the full IndexSpec shape). Without
# an index every row is scanned in full for every similarity call.
trgm = []

# testing — exposes `djogi::testing::setup_test_db` and other general test
# helpers in non-test builds (e.g. for integration harnesses that can't use
# `cfg(test)`). The HMAC key installer is gated separately by `hmac-codec`.
testing = []

# hmac-codec — gates presentation HMAC built-ins
# (`HmacSha256HexString`, `HmacSha256HexOptionString`) and the doc-hidden
# unsafe test helper `djogi::testing::install_presentation_hmac_key_for_testing`.
# The helper remains under this gate so HMAC support and test-key installation
# stay aligned instead of leaking into non-HMAC builds.
#
# The `hmac` crate dependency itself remains always-on because the snapshot
# signing module also uses HMAC-SHA256 independently of presentation codecs.
hmac-codec = []

[dependencies]
argon2 = { version = "0.5", optional = true, features = ["std"] }
# password-hash is an indirect dep of argon2. Listing it here so we can enable
# the `getrandom` feature, which activates `rand_core/getrandom` and exposes
# `rand_core::OsRng` for use in `PasswordHash::hash`.
password-hash = { version = "0.5", optional = true, features = ["getrandom"] }
djogi-macros.workspace = true
indexmap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
heeranjid.workspace = true
# sassi — sibling Rust crate providing the universal predicate algebra
# (`BasicPredicate<T>`), the typed in-memory pool (`Punnu<T>`), and
# cross-runtime trait queries. Djogi consumes the published beta so local
# development, CI, and adopters resolve the same registry source. Beta.3
# contains the JSahibON + WirePortable API surface that `MirJzSON` builds on.
# `watermark-time` opts the `time`-crate-backed `MonotonicWatermark`
# impl in (matches djogi's `time` crate baseline); default features
# (`serde`, `runtime-tokio`) stay enabled.
# `serde-json-bridge` enables `TryFrom<serde_json::Value> for JSahibON`
# and the round-trip `From<JSahibON> for serde_json::Value` impls Djogi
# routes its `MirJzSON` codec through (Phase 8.5 #195). Sassi owns the
# numeric carrier-selection rules and the structural-equality contract;
# Djogi never reimplements them.
sassi = { version = "0.1.0-beta.3", features = ["watermark-time", "serde-json-bridge"] }
tokio-postgres.workspace = true
postgres-types.workspace = true
deadpool-postgres.workspace = true
bytes.workspace = true
inventory.workspace = true
figment.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
async-trait.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
libc.workspace = true
phf.workspace = true
trait-variant.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
figment = { workspace = true, features = ["test"] }
rust_decimal_macros.workspace = true
tracing-test = "0.2"

# Lihaaf v0.1 — the raw SQL bypass compile-fail fixtures
# (`djogi/tests/compile_fail/*.rs`) prove that the `pool()`, `conn()`,
# `with_client`, and `raw_*` methods are unreachable from
# `DjogiContext` / `DjogiPool` without the `RawAccessExt` /
# `RawPoolAccessExt` traits in scope. Each fixture is a standalone
# rustc invocation against the djogi dylib; the blessed `.stderr`
# snapshots live alongside the `.rs` files and are committed so CI
# passes without `--bless`.
#
# CI invokes `cargo lihaaf --manifest-path djogi/Cargo.toml -j 2`
# alongside the djogi-macros lihaaf step (see
# `.github/workflows/ci.yml`). Re-bless locally whenever the bypass
# diagnostics change:
#   `cargo lihaaf --manifest-path djogi/Cargo.toml --bless -j 4`
# then commit the updated `.stderr` files alongside the change.
#
# `features = ["testing"]` matches the feature set the historical
# (now-removed) raw-SQL trybuild driver enabled; the testing feature
# exposes `djogi::testing::*` which some fixtures may reference.
[package.metadata.lihaaf]
dylib_crate = "djogi"
extern_crates = ["djogi"]
features = ["testing"]
dev_deps = []
edition = "2024"
fixture_dirs = ["tests/compile_fail"]

[[package.metadata.lihaaf.suite]]
name = "spatial"
features = ["testing", "spatial"]
fixture_dirs = ["tests/compile_fail_spatial"]

