# Adopter-crate isolation fixture for `#[derive(Model)]` macro path-routing (djogi#124).
#
# This crate exists for ONE purpose: prove that the macro paths exercised
# below emit code that resolves against `djogi` alone — no `sassi`,
# `heeranjid`, `time`, `uuid`, `inventory`, `serde`, `tokio`,
# `tokio-postgres`, or any other transitive crate is required at the adopter's
# `[dependencies]` table.
#
# Why a separate crate (and not another `djogi-macros/tests/compile_pass/*.rs`
# lihaaf fixture):
#
# `djogi-macros/Cargo.toml` carries `sassi`, `serde`, and `serde_json`
# as `[dev-dependencies]` so a few specialized lihaaf fixtures can
# reference them directly:
#
# - `lookup_op_regex_lifted_to_basic_predicate.rs`
#  names `sassi::LookupOp` to lock the no-regex invariant.
# - JsonbSchema fixtures derive `serde::Serialize` / `Deserialize` on
#  their schema structs.
#
# Lihaaf compiles each `compile_pass/*.rs` fixture as a standalone
# rustc invocation linked against djogi-macros' own dev-dependency
# graph. Any `compile_pass` fixture can therefore name `::sassi::*`
# directly, even though an external adopter could not. The lihaaf
# compile_pass bucket is misleading on this point: a stray `::sassi::*`
# typo in macro emission would compile inside that bucket because
# `sassi` is reachable through djogi-macros' dev-dep graph.
#
# This crate gets its own `[workspace]` table so cargo treats it as its
# own workspace root, isolating dep resolution from djogi's outer
# workspace. Its `[dependencies]` table contains exactly one entry:
# `djogi`. A macro emission that names `::sassi::*` / `::heeranjid::*`
# / `::time::*` / `::uuid::*` / `::inventory::*` / `::serde::*` /
# `::tokio::*` / `::tokio_postgres::*` etc. directly fails to compile here with
# `error[E0433]: failed to resolve: use of undeclared crate or module
# `<crate>``.
#
# Driver: `djogi-macros/tests/adopter_crate_isolation.rs` shells out
# `cargo check --all-targets --manifest-path` against this Cargo.toml.
#
# Spec anchor:
# docs/superpowers/plans/granular-phase8/cluster-8delta-granular.md
# §3 commit T7.4 — compile-fixture bullet (this fixture is the
# stronger sibling complementing the same-named lihaaf compile_pass
# fixture).

[package]
name = "djogi-adopter-isolation-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "djogi-adopter-isolation-fixture"
path = "src/main.rs"

# Empty workspace declaration — keeps this crate from being treated as an
# unlisted member of djogi's outer workspace. Its direct dependencies
# remain exactly the entries visible below.
[workspace]

[dependencies]
# The whole point of this fixture: ONLY `djogi` as a direct dependency.
# Macro-emitted code that names `::sassi::*`, `::heeranjid::*`,
# `::time::*`, `::uuid::*`, `::inventory::*`, `::serde::*`,
# `::tokio::*`, `::tokio_postgres::*`, `::postgres_types::*`, `::bytes::*`,
# `::futures::*` directly would fail to compile here — those crates are
# only reachable transitively through `djogi`'s dependency tree, never
# at adopter-side `extern crate` resolution.
#
# Path-dep mirrors `djogi-macros`'s own consumption — the workspace
# `exclude = ["sassi-reference"]` clause in djogi's root Cargo.toml
# keeps cargo from absorbing the symlink tree into djogi's workspace
# during djogi-macros' build, and the `[workspace]` block above keeps
# this fixture independent of that workspace.
djogi = { path = "../../../djogi" }
