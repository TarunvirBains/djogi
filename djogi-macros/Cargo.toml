[package]
name = "djogi-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Proc macros for the Djogi framework — derive(Model), field attributes, descriptor emission"
documentation = "https://docs.rs/djogi-macros"
readme = "../ReadMe.MD"
keywords = ["djogi", "proc-macro", "derive", "model", "orm"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
# Mirror of `djogi`'s `spatial` feature so cfg-gated trybuild fixtures
# compile against the same public API surface they enable locally.
# The macro crate itself has no spatial-specific code paths.
spatial = ["djogi/spatial"]

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
darling.workspace = true
# sassi-codegen — Cluster 8δ T7.2. Shared codegen primitives for the
# `Cacheable` and `DeltaSyncCacheable` impl emission. `model::cacheable::expand`
# delegates to `sassi_codegen::generate_cacheable_impl` (via
# `CacheableFieldsMode::external(...)` so sassi-codegen's own
# `generate_fields_struct` does not run — djogi's `model::stubs::expand`
# already owns the `{Model}Fields` name) and to
# `sassi_codegen::generate_delta_sync_cacheable_impl`, both with
# `sassi_path = ::djogi::types` so the emitted impls route through djogi's
# macro-routing surface (per `feedback_macro_path_routing.md`) rather than
# `::sassi::*` directly. `sassi-codegen` is `proc-macro = false`, so a
# proc-macro crate is permitted to depend on it as a regular library (the
# directionality cargo restricts is the reverse: a non-proc-macro crate
# cannot depend on a proc-macro crate as a runtime dep). Path-dep mirrors
# the existing `sassi-reference/` symlink layout already used by the
# `sassi` dev-dep below; the workspace `exclude = ["sassi-reference"]`
# clause keeps cargo from absorbing the symlink tree into djogi's
# workspace.
sassi-codegen = { path = "../sassi-reference/sassi-codegen" }

[dev-dependencies]
trybuild.workspace = true
# djogi as a dev-dep forms a cycle (djogi depends on djogi-macros as a
# regular dep; djogi-macros dev-deps djogi here). Cargo permits this because
# dev-deps are excluded from the published / runtime dependency graph — they
# only participate when compiling this crate's own tests. Required so trybuild
# compile_pass/*.rs fixtures can `use djogi::prelude::*` to reach `#[model]`.
# Path-only override (no `version`) so `cargo publish -p djogi-macros` succeeds
# without a publish-order cycle: djogi-macros publishes first, before djogi
# exists on crates.io, so a versioned dev-dep would fail the index lookup.
djogi = { path = "../djogi" }
# serde — needed by JsonbSchema compile_pass fixtures that derive Serialize +
# Deserialize on schema structs. The trybuild process compiles each fixture
# as a standalone crate with the same dev-deps as djogi-macros.
serde.workspace = true
# serde_json — needed by the Phase 7-Zero T2 compile_pass fixture covering
# `#[field(index = "gin")]` on `Jsonb<serde_json::Value>`. Same rationale as
# serde above: trybuild compiles fixtures as standalone crates whose deps
# come from djogi-macros' dev-dependencies.
serde_json.workspace = true
# sassi — needed by Phase 8γ T6.10 trybuild compile-fail fixture
# (`phase8_lookup_op_regex_lifted_to_basic_predicate.rs`) which references
# `sassi::LookupOp` directly to prove the no-regex-engine invariant
# (`decisions.md` rows 107 + 108): sassi's `LookupOp` enum has no `Regex`
# / `IRegex` variants, so the fixture build MUST fail. Path-dep mirrors
# djogi's own consumption — same workspace `exclude = ["sassi-reference"]`
# trick keeps cargo from absorbing the symlink tree into djogi's workspace.
sassi = { path = "../sassi-reference/sassi" }

# Lihaaf v0.1 — fast, parallel proc-macro test harness (standalone
# repo: `~/projects/lihaaf`, using a post-alpha build with diagnostic
# extraction and long-type note path normalization fixes). djogi-macros
# is the canonical adopter that drove lihaaf's design (lihaaf spec §9.1).
# Phase 8.5 runs lihaaf side-by-side with the existing trybuild driver
# (`tests/trybuild_tests.rs` / `tests/trybuild_spatial_tests.rs`); the
# trybuild → lihaaf migration is a separate later step. While the
# standalone lihaaf crate is pre-publish on consumer sites and
# `cargo-lihaaf` is not assumed to be on PATH, local invocation flows
# through the source run shape — see `tests/lihaaf/README.md` for the
# exact command.
#
# Fixture layout: see `tests/lihaaf/README.md`. compile_pass is a single
# directory symlink (`tests/lihaaf/compile_pass` → `../compile_pass`);
# compile_fail is a real directory of per-file `.rs` symlinks back to
# `../../compile_fail/*.rs` so each fixture lives in exactly one place
# on disk while lihaaf-owned `.stderr` snapshots stay separated from
# the trybuild snapshots they would otherwise clobber.
#
# `dev_deps` mirrors djogi-macros' `[dev-dependencies]` so per-fixture
# rustc invocations resolve `use serde`, `use serde_json`, and the
# `sassi::LookupOp` reference in the no-regex-engine compile-fail
# fixture. `dylib_crate = "djogi"` (not "djogi-macros") because the
# fixtures `use djogi::prelude::*` — the proc-macro crate is loaded
# transitively through djogi's `pub use djogi_macros::*` re-export.
[package.metadata.lihaaf]
dylib_crate = "djogi"
extern_crates = ["djogi", "djogi-macros"]
features = []
dev_deps = ["serde", "serde_json", "sassi"]
edition = "2024"
fixture_dirs = ["tests/lihaaf/compile_fail", "tests/lihaaf/compile_pass"]
