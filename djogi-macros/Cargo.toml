[package]
name = "djogi-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Proc macros for the Djogi framework — derive(Model), field attributes, descriptor emission"
documentation = "https://docs.rs/djogi-macros"
readme = "README.md"
keywords = ["djogi", "proc-macro", "derive", "model", "orm"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
# Mirror of `djogi`'s `spatial` feature so cfg-gated lihaaf compile-pass
# fixtures compile against the same public API surface they enable
# locally. The macro crate itself has no spatial-specific code paths.
spatial = ["djogi/spatial"]

# Mirror of `djogi`'s `network` feature (djogi#213) — INET / CIDR /
# MACADDR typed surface. The macro crate itself has no
# network-specific code paths (the `rust_type_to_sql` arms recognise
# the type names unconditionally, matching the spatial pattern); this
# feature exists only so the lihaaf `network` suite can mirror it
# through to the runtime crate when compiling the
# `tests/compile_pass_network/` fixtures.
network = ["djogi/network"]

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
darling.workspace = true
# sassi-codegen — Cluster 8δ T7.2. Shared codegen primitives for the
# `Cacheable` and `DeltaSyncCacheable` impl emission. `model::cacheable::expand`
# delegates to `sassi_codegen::generate_cacheable_impl` (via
# `CacheableFieldsMode::external(...)` so sassi-codegen's own
# `generate_fields_struct` does not run — djogi's `model::stubs::expand`
# already owns the `{Model}Fields` name) and to
# `sassi_codegen::generate_delta_sync_cacheable_impl`, both with
# `sassi_path = ::djogi::types` so the emitted impls route through djogi's
# macro-routing surface (per `feedback_macro_path_routing.md`) rather than
# `::sassi::*` directly. `sassi-codegen` is `proc-macro = false`, so a
# proc-macro crate is permitted to depend on it as a regular library (the
# directionality cargo restricts is the reverse: a non-proc-macro crate
# cannot depend on a proc-macro crate as a runtime dep). The registry version
# stays in lock-step with the `sassi` beta consumed by `djogi`.
sassi-codegen = "0.1.0-beta.3"

[dev-dependencies]
# djogi as a dev-dep forms a cycle (djogi depends on djogi-macros as a
# regular dep; djogi-macros dev-deps djogi here). Cargo permits this because
# dev-deps are excluded from the published / runtime dependency graph — they
# only participate when compiling this crate's own tests. Required so the
# lihaaf per-fixture rustc invocations can `use djogi::prelude::*` to
# reach `#[model]`, and so in-crate integration tests
# (`adopter_crate_isolation.rs`, `cacheable_emit.rs`, etc.) link against
# djogi.
# Path-only override (no `version`) so `cargo publish -p djogi-macros` succeeds
# without a publish-order cycle: djogi-macros publishes first, before djogi
# exists on crates.io, so a versioned dev-dep would fail the index lookup.
djogi = { path = "../djogi" }
# serde — needed by JsonbSchema compile_pass fixtures that derive Serialize +
# Deserialize on schema structs. Lihaaf compiles each fixture as a
# standalone rustc invocation that links against the dev-dependencies
# declared here (mirrored into `package.metadata.lihaaf.dev_deps` below).
serde.workspace = true
# serde_json — needed by the Phase 7-Zero T2 compile_pass fixture covering
# `#[field(index = "gin")]` on `Jsonb<serde_json::Value>`. Same rationale as
# serde above: lihaaf links the fixture binaries against the dev-deps
# declared in djogi-macros' `[dev-dependencies]` table.
serde_json.workspace = true
# sassi — needed by the `lookup_op_regex_lifted_to_basic_predicate.rs`
# compile-fail fixture which references
# `sassi::LookupOp` directly to prove the no-regex-engine invariant
# (`decisions.md` rows 107 + 108): sassi's `LookupOp` enum has no `Regex`
# / `IRegex` variants, so the fixture build MUST fail. Use the same published
# beta as djogi's runtime dependency so fixture diagnostics exercise the
# adopter-visible source.
sassi = "0.1.0-beta.3"
# uuid — needed by Phase 8.5 #171 typed-array compile-pass fixture
# (`typed_array_elements.rs`) which declares `Vec<uuid::Uuid>` model fields and
# exercises the `contains`/`overlap` operators on them. `uuid` is already a
# workspace dep (djogi uses it for `RanjId` encoding); the dev-dep here makes
# the crate name resolvable in lihaaf fixture binaries.
uuid.workspace = true
# rust_decimal — needed by the same typed-array fixture for `Vec<Decimal>`
# field declarations and array operators. Already a workspace dep (djogi uses
# it for NUMERIC columns).
rust_decimal.workspace = true
# time — needed by the #215 range compile-pass fixture for
# `Range<time::PrimitiveDateTime>` / `tsrange`.
time.workspace = true

# Lihaaf v0.1 — fast, parallel proc-macro test harness. djogi-macros is
# the canonical adopter that drove lihaaf's design (lihaaf spec §9.1).
# Lihaaf is the **sole** macro-fixture gate; trybuild has been removed
# from djogi entirely.
#
# CI installs lihaaf via `cargo install lihaaf --version 0.1.2
# --locked` and runs `cargo lihaaf --manifest-path djogi-macros/Cargo.toml
# -j 2`. The currently 202 compile_fail `.stderr` snapshots under
# `tests/compile_fail/` ARE committed so CI succeeds without `--bless`.
# Re-bless locally whenever macro diagnostics change:
#   `cargo lihaaf --manifest-path djogi-macros/Cargo.toml \
#       --filter compile_fail --bless -j 4`
# then commit the updated `.stderr` files alongside the diagnostic change.
#
# Fixture layout: lihaaf walks `tests/compile_fail/` and `tests/compile_pass/`
# in the default suite, plus `tests/compile_pass_spatial/` and
# `tests/compile_pass_network/` in the named `spatial` and `network` suites.
# The `.rs` fixtures live in those directories alongside the blessed
# `.stderr` snapshots — no symlink farm, no shadow corpus.
#
# `dev_deps` mirrors djogi-macros' `[dev-dependencies]` so per-fixture
# rustc invocations resolve `use serde`, `use serde_json`, and the
# `sassi::LookupOp` reference in the no-regex-engine compile-fail
# fixture. `dylib_crate = "djogi"` (not "djogi-macros") because the
# fixtures `use djogi::prelude::*` — the proc-macro crate is loaded
# transitively through djogi's `pub use djogi_macros::*` re-export.
[package.metadata.lihaaf]
dylib_crate = "djogi"
extern_crates = ["djogi", "djogi-macros"]
features = []
dev_deps = ["serde", "serde_json", "sassi", "uuid", "rust_decimal", "time"]
edition = "2024"
fixture_dirs = ["tests/compile_fail", "tests/compile_pass"]

# Spatial compile-pass fixtures live in their own named suite so lihaaf
# builds the djogi dylib and per-fixture rustc invocations with
# `--features spatial`. This preserves the old trybuild_spatial_tests
# coverage without re-enabling spatial for the default fixture corpus.
[[package.metadata.lihaaf.suite]]
name = "spatial"
features = ["spatial"]
fixture_dirs = ["tests/compile_pass_spatial"]

# Network (djogi#213) compile-pass fixtures live in their own named
# suite. Same pattern as `spatial`: per-fixture rustc invocations get
# `--features network`, so `std::net::IpAddr` / `djogi::CidrAddr` /
# `djogi::MacAddr` fields lower and the typed `eq` / `set` surfaces
# resolve. The default fixture corpus stays feature-clean.
[[package.metadata.lihaaf.suite]]
name = "network"
features = ["network"]
fixture_dirs = ["tests/compile_pass_network"]
