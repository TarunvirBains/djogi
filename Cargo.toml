[workspace]
members = ["djogi", "djogi-macros", "djogi-cli", "djogi-shell", "examples/elephant-tracker", "xtask"]
# Local sibling-repo symlinks (per `reference_sibling_repos.md`) can live
# alongside this workspace as `*-reference` directories. They are gitignored
# and excluded so Cargo never treats an incidental sibling checkout as a djogi
# workspace member. The committed dependency graph resolves Sassi from
# crates.io; local sibling overrides should stay local.
exclude = ["sassi-reference"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.9"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TarunvirBains/djogi"
homepage = "https://github.com/TarunvirBains/djogi"
authors = ["Tarunvir Bains"]
rust-version = "1.95"

[workspace.dependencies]
# Core
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
rust_decimal_macros = "1"

# SQL substrate — tokio-postgres + postgres-types + deadpool-postgres.
# These form the runtime executor: tokio-postgres for direct async Postgres
# access, deadpool-postgres for connection pooling, postgres-types for
# type-safe encode/decode.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-time-0_3", "with-serde_json-1", "with-uuid-1", "array-impls"] }
postgres-types = { version = "0.2", default-features = false, features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1", "array-impls"] }
indexmap = { version = "2", features = ["serde"] }
deadpool-postgres = "0.14"
bytes = "1"

# HeeRanjId — 0.3 added `HeerIdDesc` / `RanjIdDesc` reverse-chronological ID
# siblings consumed by the reverse-chronological PK variants (`pk = "heerid_desc"` / `pk = "ranjid_desc"`).
# 0.4 tightens the serde wire contract: human-readable formats (serde_json) keep
# the decimal-string representation that 0.3 already used; non-human-readable
# formats (postcard, bincode) now emit the inner primitive directly so binary
# wire sizes are minimal. The `postgres` feature additionally covers the *Desc
# types and the `ToSql`/`FromSql` impls for all four ID types.
heeranjid = { version = "0.4.0", features = ["postgres"] }

# Proc macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
inventory = "0.3"
darling = "0.23"
trait-variant = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Error handling
thiserror = "2"

# Logging — used for the `DjogiContext::on_commit` callback error path
# (log, do not unwind). Only the macros are consumed here;
# subscriber wiring is the adopter's choice.
tracing = "0.1"

# async-trait — enables `async fn` in trait definitions where the trait must
# be usable as a trait object (`dyn Publisher`, etc.). Required for the outbox
# `Publisher` trait so callers can store heterogeneous publisher implementations
# behind a single pointer type.
async-trait = "0.1"

# Future combinators — specifically `FutureExt::catch_unwind` for the
# panic-safe on_commit drain and the `atomic()` panic propagation guard.
# The std `catch_unwind` only works on closures; async futures require
# the `futures` variant. `default-features = false` keeps the surface
# minimal — we only consume `catch_unwind`.
futures = { version = "0.3", default-features = false, features = ["std"] }

# Hashing — SHA-256 for migration checksum (`V1:<64-hex>`) and stable
# 64-bit hashing of `BucketKey { database, app }` into a Postgres
# advisory-lock key. SHA-256 is already in the transitive dep tree
# via `password-hash` / `argon2`; promoting it to a direct dep keeps the
# migration runner's public contract from depending on a transitive
# upgrade path.
sha2 = "0.11"

# HMAC-SHA256 — snapshot signing. Pinned to `0.13` so the `digest 0.11`
# traits line up with the workspace's `sha2 = "0.11"` baseline (the older
# `hmac = "0.12"` line targets `digest 0.10` and will not compile against
# `sha2 0.11`). Used by `djogi::snapshot::sign` for HMAC-SHA256
# sign/verify of migration snapshot payloads.
hmac = "0.13"

# Constant-time byte comparison — `subtle::ConstantTimeEq` backs the
# snapshot-signature verify path; using a plain `==` on signature bytes
# leaks one-byte timing information per comparison. Pulled in as a direct
# dep so the security-critical comparison routes through a vetted
# implementation rather than a hand-rolled loop.
subtle = "2"

# libc — file-level workspace lock primitive in `migrate::guard`.
# Uses `flock(LOCK_EX | LOCK_NB)` directly for the 30-second bounded-retry
# acquire path. Already in the transitive dep tree via `tokio` and
# `deadpool`; promoting to a direct dep makes the file-lock implementation
# self-contained.
libc = "0.2"

# phf — compile-time perfect-hash sets / maps. Backs the field-codec
# registry: codec IDs must be known at framework-compile time so the
# `#[field(protected(codec = "<id>"))]` macro can reject unknown
# identifiers during macro expansion rather than at runtime. Codecs
# are code, not data — runtime registration is intentionally rejected.
# The `macros` feature unlocks `phf::phf_set!` / `phf::phf_map!`.
phf = { version = "0.13", features = ["macros"] }

# Internal — `version` alongside `path` is required so `cargo publish` resolves
# the dep against crates.io rather than the local path. Local builds use the
# path; published tarballs use the version. The cyclic dev-dep from djogi-macros
# back to djogi is handled by overriding to path-only in djogi-macros's
# `[dev-dependencies]` (dev-deps are stripped from published tarballs anyway).
djogi = { path = "djogi", version = "0.1.0-alpha.0" }
djogi-macros = { path = "djogi-macros", version = "0.1.0-alpha.0" }
