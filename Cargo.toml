[workspace]
members = ["djogi", "djogi-macros", "djogi-cli", "djogi-shell"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TarunvirBains/djogi"
authors = ["Tarunvir Bains"]

[workspace.dependencies]
# Core
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "time", "uuid", "json", "rust_decimal"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
rust_decimal_macros = "1"

# New SQL substrate — tokio-postgres + postgres-types + deadpool-postgres.
# These replace sqlx as the runtime executor; sqlx remains in dev-dependencies
# for the existing #[sqlx::test] integration test harness through T9.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-time-0_3", "with-serde_json-1", "with-uuid-1"] }
postgres-types = { version = "0.2", default-features = false, features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1"] }
deadpool-postgres = "0.14"
bytes = "1"

# HeeRanjId — bumped to 0.2 for tokio-postgres / postgres-types codec support.
# The `postgres` feature enables `postgres_types::ToSql`/`FromSql` impls for
# `HeerId` (BIGINT) and `RanjId` (UUID). heeranjid-sqlx stays only as a
# dev-dependency for the #[sqlx::test] harness through T8.
# Both features enabled: `postgres` for tokio-postgres ToSql/FromSql (T2+),
# `sqlx` for the sqlx::Encode/Decode impls required by the sqlx::FromRow impl
# emitted by #[model] (preserved through T9 for the #[sqlx::test] harness).
heeranjid = { version = "0.2", features = ["postgres", "sqlx"] }
heeranjid-sqlx = "0.1.2"

# Proc macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
inventory = "0.3"
darling = "0.20"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Error handling
thiserror = "2"

# Logging — used for the `DjogiContext::on_commit` callback error path per
# Phase 4 v3 Q9 (log, do not unwind). Only the macros are consumed here;
# subscriber wiring is the adopter's choice.
tracing = "0.1"

# Future combinators — specifically `FutureExt::catch_unwind` for the
# panic-safe on_commit drain and the `atomic()` panic propagation guard
# (Phase 4 Task 1). The std `catch_unwind` only works on closures; async
# futures require the `futures` variant. `default-features = false` keeps
# the surface minimal — we only consume `catch_unwind`.
futures = { version = "0.3", default-features = false, features = ["std"] }

# Testing
trybuild = { version = "1", features = ["diff"] }

# Internal
djogi = { path = "djogi" }
djogi-macros = { path = "djogi-macros" }
