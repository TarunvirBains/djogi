[workspace]
members = ["djogi", "djogi-macros", "djogi-cli", "djogi-shell"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TarunvirBains/djogi"
authors = ["Tarunvir Bains"]

[workspace.dependencies]
# Core
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "time", "uuid", "json", "rust_decimal"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["serde"] }
rust_decimal = "1"

# HeeRanjId — the `sqlx` feature (HeerId/RanjId Decode/Encode impls) lands in
# 0.1.2 via TarunvirBains/HeeRanjID#15. Until that PR merges and 0.1.2 is on
# crates.io, the `[patch.crates-io]` block below redirects to the local
# sibling workspace (currently on main @ 0.1.1 — the feature branch has the
# 0.1.2 version bump). After publish: bump these to "0.1.2" and remove the
# patch block in the same commit.
heeranjid = { version = "0.1.1", features = ["sqlx"] }
heeranjid-sqlx = "0.1.1"

# Proc macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
inventory = "0.3"
darling = "0.20"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Error handling
thiserror = "2"

# Testing
trybuild = { version = "1", features = ["diff"] }

# Internal
djogi = { path = "djogi" }
djogi-macros = { path = "djogi-macros" }

# ---------------------------------------------------------------------------
# Override crates.io heeranjid / heeranjid-sqlx with the local sibling
# workspace, which includes the `sqlx` feature flag (HeerId/RanjId
# Decode/Encode impls). Remove this patch block once those features are
# published to crates.io.
# ---------------------------------------------------------------------------
[patch.crates-io]
heeranjid = { path = "../../../HeeRanjID/heeranjid" }
heeranjid-sqlx = { path = "../../../HeeRanjID/heeranjid-sqlx" }
