[workspace]
members = ["djogi", "djogi-macros", "djogi-cli", "djogi-shell"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TarunvirBains/djogi"
authors = ["Tarunvir Bains"]

[workspace.dependencies]
# Core
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
rust_decimal_macros = "1"

# SQL substrate — tokio-postgres + postgres-types + deadpool-postgres.
# These form the runtime executor: tokio-postgres for direct async Postgres
# access, deadpool-postgres for connection pooling, postgres-types for
# type-safe encode/decode.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-time-0_3", "with-serde_json-1", "with-uuid-1", "array-impls"] }
postgres-types = { version = "0.2", default-features = false, features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1", "array-impls"] }
indexmap = { version = "2", features = ["serde"] }
deadpool-postgres = "0.14"
bytes = "1"

# HeeRanjId — 0.2.1 adds `heeranjid::postgres_schema::install_schema` and
# `seed_default_node` async helpers (gated on the `postgres` feature), plus
# SQL constants (`INSTALL_SQL`, `SEED_SQL`, etc.). The `postgres` feature
# enables `postgres_types::ToSql`/`FromSql` impls for `HeerId` (BIGINT) and
# `RanjId` (UUID).
heeranjid = { version = "0.2.1", features = ["postgres"] }

# Proc macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
inventory = "0.3"
darling = "0.20"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Error handling
thiserror = "2"

# Logging — used for the `DjogiContext::on_commit` callback error path per
# Phase 4 v3 Q9 (log, do not unwind). Only the macros are consumed here;
# subscriber wiring is the adopter's choice.
tracing = "0.1"

# Future combinators — specifically `FutureExt::catch_unwind` for the
# panic-safe on_commit drain and the `atomic()` panic propagation guard
# (Phase 4 Task 1). The std `catch_unwind` only works on closures; async
# futures require the `futures` variant. `default-features = false` keeps
# the surface minimal — we only consume `catch_unwind`.
futures = { version = "0.3", default-features = false, features = ["std"] }

# Testing
trybuild = { version = "1", features = ["diff"] }

# Internal
djogi = { path = "djogi" }
djogi-macros = { path = "djogi-macros" }
