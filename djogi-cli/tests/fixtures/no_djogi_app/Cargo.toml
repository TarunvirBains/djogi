# Own workspace — isolate dep resolution from djogi's outer workspace.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "no-djogi-app"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "djogi"
path = "src/bin/djogi.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
