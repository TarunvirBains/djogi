name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://djogi:djogi@localhost:5432/djogi_test

# dorny/paths-filter needs pull-requests:read to call GitHub's listFiles API.
# Without this, fork/contributor PRs (and first-party PRs under default-
# restricted GITHUB_TOKEN) fail with "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        # Use the same PostGIS-backed Postgres image as the spatial lane so
        # extension availability does not drift between local dev, default CI,
        # and all-features CI. Individual tests still create extensions per
        # database through `#[djogi_test(extensions = [...])]` or migration
        # bootstrap; image availability is not database installation.
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: djogi
          POSTGRES_PASSWORD: djogi
          POSTGRES_DB: djogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djogi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      # `sassi-reference` is a path-dep symlink in local dev (points at the
      # sister `~/projects/sassi` workspace so cargo picks up uncommitted
      # sassi changes immediately). On GHA the symlink target does not
      # exist — clone the public TarunvirBains/sassi repo into the
      # `sassi-reference/` slot so `path = "../sassi-reference/sassi"` in
      # `djogi/Cargo.toml` and `djogi-macros/Cargo.toml` resolves.
      #
      # Pinned to Sassi commit c143f373 because it includes the Lihaaf
      # fixture migration and the external-field codegen API used by
      # djogi-macros. Keep this exact SHA until Djogi moves back to a
      # published Sassi version or a dedicated compatibility tag.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA; actions/checkout@v6 rejects short SHAs
          # unless the commit is reachable from the fetched refs.
          ref: c143f373c333876fa744e9aae6bd38881a8126c8
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      # Ubuntu-latest GHA runners ship with ~14GB of free disk. Phase 7-Zero
      # pushed the workspace test footprint past that ceiling — 22
      # `#[djogi_test]`s (each provisioning a per-test Postgres DB) + the
      # existing Phase 6/6.5 integration tests fill the disk partway into
      # `cargo test --workspace`. The runner dies with "No space left on
      # device" before it can finish or emit useful logs. Freeing ~30GB of
      # preinstalled tooling Djogi doesn't need (dotnet, Haskell, hosted
      # toolcache) restores headroom for the full test surface. Cheap enough
      # (~10s) to keep in every run rather than gate.
      #
      # Note: the macro-fixture gate is lihaaf, which builds one shared
      # dylib and dispatches per-fixture rustc invocations — its disk
      # footprint is bounded by the dylib plus a transient per-fixture
      # work directory. Disk pressure is primarily from integration tests
      # + Postgres.
      #
      # Skipped under `act` (local CI emulation): act bind-mounts the
      # hostedtoolcache from the runner image (read-only), so the rm
      # call fails with "Device or resource busy", and disk pressure
      # is not a concern locally. `env.ACT` is set automatically by act.
      - name: Free disk space on GHA runner
        if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # rust-src is required to keep lihaaf compile-fail snapshot bytes
          # stable between CI and local dev. When rust-src is installed,
          # rustc inlines stdlib source excerpts in error output (e.g.
          # `$RUST/lib/rustlib/src/rust/library/alloc/src/string.rs:353:1`);
          # without it, those lines are absent and committed `.stderr`
          # snapshots that reference `$RUST` diverge. Removing rust-src from
          # CI would invalidate the committed lihaaf snapshots under
          # `djogi-macros/tests/compile_fail/` and
          # `djogi/tests/compile_fail/`.
          components: clippy, rustfmt, rust-src

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Raw SQL bypass justifications
        run: cargo xtask check-justifications

      - name: Test surface policy
        run: cargo xtask check-test-surface

      - name: Spatial CI manifest policy
        run: cargo xtask check-spatial-ci

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features spatial,outbox,notify,testing -- -D warnings

      # cargo-deny only runs when dependencies actually change. The license
      # / advisory check is deterministic given the lockfile, so re-running
      # it on every PR that touches only Rust sources or docs is waste.
      # Path filter scopes execution to PRs that modify a Cargo.toml /
      # Cargo.lock / deny.toml — i.e. where the policy could change.
      #
      # Skipped under act: `dorny/paths-filter` calls `git branch
      # --show-current` against the runner workspace, which act
      # populates via `docker cp` (no git history). The cargo-deny
      # step below treats `env.ACT == true` as "always run" so local
      # vetting still gets the license/advisory check.
      - name: Detect dependency changes
        id: dep-changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'deny.toml'

      - name: cargo-deny (license + advisory check)
        if: ${{ env.ACT || steps.dep-changes.outputs.deps == 'true' }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # Install lihaaf, the sole compile-fixture CI gate for djogi (both
      # macro fixtures in djogi-macros and the raw-SQL bypass fixtures in
      # djogi). Pinned to the same version used to bless the committed
      # `.stderr` snapshots under `djogi-macros/tests/compile_fail/` and
      # `djogi/tests/compile_fail/`. Bump this pin when upgrading lihaaf
      # and re-blessing snapshots locally.
      #
      # `--locked` ensures the install uses the exact dependency versions
      # in lihaaf's published Cargo.lock rather than resolving fresh; this
      # makes the install deterministic across CI runs.
      - name: Install lihaaf (compile-fixture CI gate)
        run: cargo install lihaaf --version 0.1.0-alpha.4 --locked

      - name: Build
        run: cargo build --workspace

      # Macro-fixture gate — 237 proc-macro fixtures (99 compile_pass +
      # 138 compile_fail) using lihaaf's build-once-dylib + per-fixture-
      # rustc model:
      #   • djogi is built once as a dylib per session
      #   • per-fixture rustc invocations are parallel (-j 2 on 2-vCPU GHA)
      #
      # Committed `.stderr` snapshots mean `--bless` is never needed here.
      # If this step fails with `SNAPSHOT_DIFF`, re-bless locally:
      #   cargo lihaaf --manifest-path djogi-macros/Cargo.toml \
      #     --filter compile_fail --bless -j 4
      # then commit the updated `.stderr` files alongside the macro change.
      - name: Macro fixture gate (lihaaf, djogi-macros)
        run: cargo lihaaf --manifest-path djogi-macros/Cargo.toml -j 2

      # Raw-SQL bypass compile-fail gate — 6 fixtures pinning the
      # `pool()` / `conn()` / `with_client` / `raw_*` private/extension-
      # trait-gated APIs on `DjogiContext` and `DjogiPool`. Same dylib +
      # per-fixture rustc shape as the macro gate; lihaaf reuses the
      # djogi dylib it just built.
      - name: Raw-SQL bypass gate (lihaaf, djogi)
        run: cargo lihaaf --manifest-path djogi/Cargo.toml -j 2

      - name: Test
        # Excluding `elephant-tracker` here is load-bearing. Its
        # `Cargo.toml` activates djogi's `spatial` + `outbox` features,
        # and under cargo's resolver-2 workspace feature unification a
        # `cargo test --workspace` would cascade those activations onto
        # djogi globally. That would mix the default-features lane with
        # the all-features spatial lane and bypass the manifest contract
        # in `tests/spatial-ci-tests.txt`. The Spatial (PostGIS) job below
        # runs those tests intentionally with `--all-features`; here we
        # keep elephant-tracker out of the unified feature graph so the
        # default-features sweep stays default-features. The Build step
        # above still covers `--workspace`. Tracked in issue #80.
        run: cargo test --workspace --exclude elephant-tracker -- --test-threads=1

      - name: Phase 8 cache modifier
        # This target pins SQL-shape parity through djogi's test-only SQL
        # renderer, so Cargo skips it in the default-feature workspace sweep.
        run: cargo test -p djogi --features testing --test phase8_t7_3_cache_modifier -- --test-threads=1

      - name: Raw SQL bypass pin tests
        run: >
          cargo test -p djogi --features testing
          --test raw_execute_pin
          --test raw_query_pin
          --test raw_rows_pin
          --test raw_fetch_one_pin
          --test raw_scalar_pin
          --test raw_ddl_pin
          --test raw_stream_pin
          --test raw_stream_with_fetch_size_pin
          --test raw_pool_access_pin
          -- --test-threads=1

  # MSRV gate — verifies the code still compiles on the toolchain
  # declared in `workspace.package.rust-version`. The main `check`
  # job runs on `@stable` so new clippy lints surface proactively
  # as the toolchain advances; this separate job pins to the
  # adopter-contract minimum so a stray `extract_if` (or any other
  # post-MSRV stdlib API) lights up here before it lands. No tests
  # run — test-deps drift higher than the library itself, and the
  # contract is "library code compiles on MSRV", not "test stack
  # works on MSRV". Default features only; spatial users have their
  # own feature-specific MSRV expectation.
  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # See `check` job for rationale.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA; actions/checkout@v6 rejects short SHAs
          # unless the commit is reachable from the fetched refs.
          ref: c143f373c333876fa744e9aae6bd38881a8126c8
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      - name: Install MSRV toolchain (matches workspace.package.rust-version)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry/git/target (MSRV)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: cargo check (default features)
        run: cargo check --workspace

  # Spatial / PostGIS coverage — runs every test listed in
  # `tests/spatial-ci-tests.txt` with `--all-features`. The default
  # `check` job above uses the same PostGIS-backed service image, but
  # it intentionally runs default features only; tests with
  # `required-features = ["spatial"]` do not execute there, and mixed
  # tests with `#[cfg(feature = "spatial")]` compile out their spatial
  # scenarios. `cargo xtask check-spatial-ci` keeps this manifest in
  # sync with Cargo test metadata and included source files.
  #
  # Kept as a separate job rather than a feature toggle inside `check`
  # so all-features spatial runtime coverage remains explicit and easy
  # to attribute.
  spatial:
    name: Spatial (PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        # `postgis/postgis` provides Postgres + PostGIS preinstalled.
        # The `:18-3.6` tag pins to Postgres 18 (Djogi's supported
        # version) with PostGIS 3.6. The image is officially maintained
        # by the PostGIS team and is the standard choice for CI.
        # (Codex T10 round-2 B-1: `:18-3.5` is not a published tag;
        # the upstream image registry only ships PostGIS 3.5 against
        # Postgres 17, and PostGIS 3.6 against Postgres 18.)
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: djogi
          POSTGRES_PASSWORD: djogi
          POSTGRES_DB: djogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djogi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://djogi:djogi@localhost:5432/djogi_test

    steps:
      - uses: actions/checkout@v6

      # See `check` job for rationale.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA; actions/checkout@v6 rejects short SHAs
          # unless the commit is reachable from the fetched refs.
          ref: c143f373c333876fa744e9aae6bd38881a8126c8
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      - name: Free disk space on GHA runner
        if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, rust-src

      # Two-cache layout: registry/git share with the `check` job
      # (same Cargo.lock → same .crate downloads), but `target/` is
      # isolated per feature set because `check` builds with default
      # features and `spatial` builds with `--all-features`. Sharing a
      # `target/` would force one job's incremental artifacts to evict
      # the other's, doubling cache misses. Splitting only the build
      # output keeps the 10 GB repo cache budget healthy. (Codex T10
      # round-2 N-2.)
      - name: Cache cargo registry/git (shared with check job)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo target (spatial feature set)
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-spatial-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-target-spatial-

      - name: Spatial manifest tests
        run: |
          while IFS= read -r test_name; do
            case "$test_name" in
              ""|\#*) continue ;;
            esac
            echo "::group::cargo test -p djogi --test ${test_name} --all-features"
            cargo test -p djogi --test "$test_name" --all-features -- --test-threads=1
            echo "::endgroup::"
          done < tests/spatial-ci-tests.txt
