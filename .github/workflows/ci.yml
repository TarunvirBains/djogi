name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://djogi:djogi@localhost:5432/djogi_test

# dorny/paths-filter needs pull-requests:read to call GitHub's listFiles API.
# Without this, fork/contributor PRs (and first-party PRs under default-
# restricted GITHUB_TOKEN) fail with "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: djogi
          POSTGRES_PASSWORD: djogi
          POSTGRES_DB: djogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djogi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      # `sassi-reference` is a path-dep symlink in local dev (points at the
      # sister `~/projects/sassi` workspace so cargo picks up uncommitted
      # sassi changes immediately). On GHA the symlink target does not
      # exist — clone the public TarunvirBains/sassi repo into the
      # `sassi-reference/` slot so `path = "../sassi-reference/sassi"` in
      # `djogi/Cargo.toml` and `djogi-macros/Cargo.toml` resolves.
      #
      # Pinned to commit SHA `49190ad` ("chore(release): prepare
      # v0.1.0-alpha.3") rather than a tag because sassi has not yet
      # tagged v0.1.0-alpha.3 on GitHub (only `v0.1.0-alpha.1` and
      # `v0.1.0-alpha.2` are published). djogi's `Cargo.lock` was
      # generated against the local path-dep at the alpha.3 prep
      # commit, so CI must check out the matching SHA. Bump to
      # `ref: v0.1.0-alpha.3` once sassi publishes that tag.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA — actions/checkout@v6 rejects
          # short SHAs with "branch or tag … could not be found".
          # Pin to v0.1.0-alpha.3 prep commit; bump to `ref:
          # v0.1.0-alpha.3` (and drop `fetch-depth`) once sassi
          # tags it.
          ref: 49190adc43174dae6dcc6dea35911bc62c385794
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      # Ubuntu-latest GHA runners ship with ~14GB of free disk. Phase 7-Zero
      # pushed the workspace test footprint past that ceiling — 22
      # `#[djogi_test]`s (each provisioning a per-test Postgres DB) + 50+
      # trybuild fixtures (each compiling to its own binary) + the existing
      # Phase 6/6.5 integration tests fill the disk partway into
      # `cargo test --workspace`. The runner dies with "No space left on
      # device" before it can finish or emit useful logs. Freeing ~30GB of
      # preinstalled tooling Djogi doesn't need (dotnet, Haskell, hosted
      # toolcache) restores headroom for the full test surface. Cheap enough
      # (~10s) to keep in every run rather than gate.
      #
      # Skipped under `act` (local CI emulation): act bind-mounts the
      # hostedtoolcache from the runner image (read-only), so the rm
      # call fails with "Device or resource busy", and disk pressure
      # is not a concern locally. `env.ACT` is set automatically by act.
      - name: Free disk space on GHA runner
        if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # rust-src is required for trybuild compile-fail fixtures that
          # capture const-eval panics originating in stdlib — rustc inlines
          # stdlib source excerpts in error output only when rust-src is
          # installed, so stored `.stderr` snapshots drift between sandboxes
          # with and without it. Adding rust-src here keeps CI's rustc
          # output shape aligned with local dev environments that install
          # it by default (e.g., rust-analyzer users).
          components: clippy, rustfmt, rust-src

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Raw SQL bypass justifications
        run: cargo xtask check-justifications

      - name: Raw SQL ordinary test surface
        run: cargo xtask check-test-surface

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features spatial,outbox,notify,testing -- -D warnings

      # cargo-deny only runs when dependencies actually change. The license
      # / advisory check is deterministic given the lockfile, so re-running
      # it on every PR that touches only Rust sources or docs is waste.
      # Path filter scopes execution to PRs that modify a Cargo.toml /
      # Cargo.lock / deny.toml — i.e. where the policy could change.
      #
      # Skipped under act: `dorny/paths-filter` calls `git branch
      # --show-current` against the runner workspace, which act
      # populates via `docker cp` (no git history). The cargo-deny
      # step below treats `env.ACT == true` as "always run" so local
      # vetting still gets the license/advisory check.
      - name: Detect dependency changes
        id: dep-changes
        if: ${{ !env.ACT }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'deny.toml'

      - name: cargo-deny (license + advisory check)
        if: ${{ env.ACT || steps.dep-changes.outputs.deps == 'true' }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Build
        run: cargo build --workspace

      - name: Test
        # Excluding `elephant-tracker` here is load-bearing. Its
        # `Cargo.toml` activates djogi's `spatial` + `outbox` features,
        # and under cargo's resolver-2 workspace feature unification a
        # `cargo test --workspace` would cascade those activations onto
        # djogi globally — forcing spatial-gated integration tests in
        # djogi (e.g., `phase6_5_spatial_polish`) to compile with the
        # spatial cfg active and then panic at runtime trying to
        # `CREATE EXTENSION postgis` against the default-features test
        # container, which has no PostGIS. The Spatial (PostGIS) job
        # below runs those tests intentionally with `--all-features`
        # against a postgis-enabled image; here we keep
        # elephant-tracker out of the unified feature graph so the
        # default-features sweep stays default-features. The Build
        # step above still covers `--workspace` (build, not test —
        # PostGIS is a runtime dep, not a compile dep). Tracked in
        # issue #80.
        run: cargo test --workspace --exclude elephant-tracker -- --test-threads=1

      - name: Phase 8 cache modifier
        # This target pins SQL-shape parity through djogi's test-only SQL
        # renderer, so Cargo skips it in the default-feature workspace sweep.
        run: cargo test -p djogi --features testing --test phase8_t7_3_cache_modifier -- --test-threads=1

      - name: Raw SQL bypass pin tests
        run: >
          cargo test -p djogi --features testing
          --test raw_execute_pin
          --test raw_query_pin
          --test raw_rows_pin
          --test raw_fetch_one_pin
          --test raw_scalar_pin
          --test raw_ddl_pin
          --test raw_stream_pin
          --test raw_stream_with_fetch_size_pin
          --test raw_pool_access_pin
          -- --test-threads=1

      - name: Raw SQL compile-fail gate
        run: cargo test -p djogi --test raw_sql_compile_fail --features testing

  # MSRV gate — verifies the code still compiles on the toolchain
  # declared in `workspace.package.rust-version`. The main `check`
  # job runs on `@stable` so new clippy lints surface proactively
  # as the toolchain advances; this separate job pins to the
  # adopter-contract minimum so a stray `extract_if` (or any other
  # post-MSRV stdlib API) lights up here before it lands. No tests
  # run — test-deps drift higher than the library itself, and the
  # contract is "library code compiles on MSRV", not "test stack
  # works on MSRV". Default features only; spatial users have their
  # own feature-specific MSRV expectation.
  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # See `check` job for rationale.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA — actions/checkout@v6 rejects
          # short SHAs with "branch or tag … could not be found".
          # Pin to v0.1.0-alpha.3 prep commit; bump to `ref:
          # v0.1.0-alpha.3` (and drop `fetch-depth`) once sassi
          # tags it.
          ref: 49190adc43174dae6dcc6dea35911bc62c385794
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      - name: Install MSRV toolchain (matches workspace.package.rust-version)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry/git/target (MSRV)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: cargo check (default features)
        run: cargo check --workspace

  # Spatial / PostGIS coverage — runs the Phase 7 T10 sync_models
  # spatial scenario against a PostGIS-enabled Postgres image. The
  # default `check` job above runs only with default features against
  # `postgres:18`, so any test that calls into `CREATE EXTENSION
  # postgis` is silently skipped there (Codex T10 round-1 B-1: the
  # `extensions`-before-`sync_models` ordering proof for
  # `geography(Point, 4326)` columns lives only in the `spatial`
  # feature, and without this dedicated job the proof never runs in
  # CI).
  #
  # Runs `phase7_t10_sync_models_live` plus every Phase 8-Zero
  # Cluster C live spatial harness (`phase8_zero_cluster_c_spatial_live`,
  # `phase8_zero_cluster_c_spatial_scalar_live`,
  # `phase8_zero_cluster_c_bench`). Future spatial-feature tests that
  # are not part of these targets must be added explicitly to the test
  # steps below — without an entry here the test silently does not run
  # in CI even when authored, as the C1 convex_hull geography-cast bug
  # demonstrated (it shipped at commit 5ec0da5 because the C1 spatial
  # live test was never wired in here, and only surfaced once the C4
  # bench was about to actually run live in this job).
  #
  # Kept as a separate job rather than a feature toggle inside `check`
  # so the spatial dependency footprint (PostGIS image pull, GEOS
  # libraries) doesn't slow down the common default-features run.
  spatial:
    name: Spatial (PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        # `postgis/postgis` provides Postgres + PostGIS preinstalled.
        # The `:18-3.6` tag pins to Postgres 18 (Djogi's supported
        # version) with PostGIS 3.6. The image is officially maintained
        # by the PostGIS team and is the standard choice for CI.
        # (Codex T10 round-2 B-1: `:18-3.5` is not a published tag;
        # the upstream image registry only ships PostGIS 3.5 against
        # Postgres 17, and PostGIS 3.6 against Postgres 18.)
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: djogi
          POSTGRES_PASSWORD: djogi
          POSTGRES_DB: djogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djogi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://djogi:djogi@localhost:5432/djogi_test

    steps:
      - uses: actions/checkout@v6

      # See `check` job for rationale.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA — actions/checkout@v6 rejects
          # short SHAs with "branch or tag … could not be found".
          # Pin to v0.1.0-alpha.3 prep commit; bump to `ref:
          # v0.1.0-alpha.3` (and drop `fetch-depth`) once sassi
          # tags it.
          ref: 49190adc43174dae6dcc6dea35911bc62c385794
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      - name: Free disk space on GHA runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, rust-src

      # Two-cache layout: registry/git share with the `check` job
      # (same Cargo.lock → same .crate downloads), but `target/` is
      # isolated per feature set because `check` builds with default
      # features and `spatial` builds with `--all-features`. Sharing a
      # `target/` would force one job's incremental artifacts to evict
      # the other's, doubling cache misses. Splitting only the build
      # output keeps the 10 GB repo cache budget healthy. (Codex T10
      # round-2 N-2.)
      - name: Cache cargo registry/git (shared with check job)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo target (spatial feature set)
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-spatial-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-target-spatial-

      # Run the T10 live sync_models suite with `--all-features` so the
      # `#[cfg(feature = "spatial")]` scenarios compile and execute.
      # Single-threaded because each `#[djogi_test]` provisions its own
      # per-test database; concurrent provisioning races on
      # CREATE/DROP DATABASE.
      - name: T10 spatial sync_models live test
        run: cargo test -p djogi --test phase7_t10_sync_models_live --all-features -- --test-threads=1

      - name: Phase 6 spatial live test (GeoPoint, within_km, order_by_distance)
        run: cargo test -p djogi --test phase6_spatial --all-features -- --test-threads=1

      - name: Phase 6.5 spatial polish live test (LineString, Polygon, MultiPoint, contains/intersects)
        run: cargo test -p djogi --test phase6_5_spatial_polish --all-features -- --test-threads=1

      - name: Cluster C spatial live test (T16/T17 — convex_hull, intersection, area)
        run: cargo test -p djogi --test phase8_zero_cluster_c_spatial_live --all-features -- --test-threads=1

      - name: Cluster C spatial scalar live test (C1 — area_of scalar probes)
        run: cargo test -p djogi --test phase8_zero_cluster_c_spatial_scalar_live --all-features -- --test-threads=1

      - name: Cluster C window live test (T18 — RowNumber/Rank/DenseRank, qualify lowering)
        run: cargo test -p djogi --test phase8_zero_cluster_c_window_live --all-features -- --test-threads=1

      - name: Cluster C smoke benchmarks (T20b — convex_hull + qualify lowering)
        run: cargo test -p djogi --test phase8_zero_cluster_c_bench --all-features -- --test-threads=1
