name: Public-text secret hygiene

# This workflow guards public-facing GitHub text (issue bodies, PR titles /
# bodies, review bodies, review-comment bodies) against credential-shaped
# strings before they go live. It runs the same `cargo xtask check-secrets
# --stdin` scanner that adopters use locally.
#
# === Security shape ===
#
# The scanner is Rust code; running it requires building from sources.
# Those sources, plus the entire `cargo` build path, must come from a
# *trusted* checkout — otherwise a malicious PR could replace
# `xtask/src/check_secrets.rs`, a build.rs, a workspace `Cargo.toml`
# dependency, etc., and execute arbitrary code with `GITHUB_TOKEN`
# privileges. The shape below is structured so that:
#
#   1. `pull_request_target` (not `pull_request`) is the PR trigger, so the
#      workflow runs in the *base* branch's context. `actions/checkout@v6`
#      with no `ref:` defaults to the base ref, which means scanner sources
#      always come from the protected default branch — never from PR head.
#      The other triggers (`issues`, `issue_comment`,
#      `pull_request_review`, `pull_request_review_comment`) likewise run
#      against the default branch by default, so the checkout pattern is
#      uniform across event types.
#
#   2. The cargo / scanner step (`Scan text for obvious secrets`) is *not*
#      given `GITHUB_TOKEN` via `env:`. Even though the scanner code itself
#      is trusted, defense-in-depth keeps the token away from the only
#      arbitrary-code-execution step in the workflow. If a vulnerability
#      ever did slip into main's scanner / build path, it could not turn
#      around and use the token to comment, label, merge, or otherwise
#      mutate the repo.
#
#   3. `GITHUB_TOKEN` is bound to the comment-posting step only — and that
#      step reads a pre-validated, redacted report file written by the
#      scanner step. The posting step runs no cargo / Rust / scanner code;
#      its entire job is `cat | jq | curl` against the GitHub REST API.
#
#   4. Before persisting the scanner report, the scanner step validates
#      its shape (size cap + printable-ASCII-only). The scanner is already
#      documented to emit only structural redactions (`<REDACTED>`,
#      `<REDACTED N bytes>`, `<stdin>:<line>: <kind>: ...`), but the
#      cheap shape check is defence-in-depth: if scanner output ever
#      drifts into emitting raw matched values or control bytes, the
#      workflow fails *before* the token-bearing step runs.
#
#   5. The workflow hard-fails on findings even when the comment posts
#      successfully — a green check on a body with leaked credentials
#      would defeat the point of the guard.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # `pull_request_target` (not `pull_request`) — runs in the base-branch
  # context with the base branch's checked-in workflow + xtask sources.
  # The PR's own commits do NOT execute here. See the `Security shape`
  # comment above.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard:
    name: Check public GitHub text
    runs-on: ubuntu-latest
    # NOTE: GITHUB_TOKEN is NOT exposed at job level. It is bound only to
    # the comment-posting step further down. Every other step — including
    # the cargo / scanner step that executes Rust code — runs without
    # token access.

    steps:
      # Trusted scanner checkout. We deliberately leave `ref:` unset:
      # - For `pull_request_target`, the default is the BASE SHA (not the
      #   PR head merge ref).
      # - For `issues` / `issue_comment` / `pull_request_review*`, the
      #   default is the repository's default branch.
      # Both yield trusted, base-branch source code. We never check out
      # PR head; PR-controlled `xtask/`, `Cargo.toml`, `build.rs`, etc.
      # never run in this workflow.
      - uses: actions/checkout@v6

      # `sassi-reference` is a path-dep symlink in local dev (points at the
      # sister `~/projects/sassi` workspace so cargo picks up uncommitted
      # `sassi` changes immediately). On GHA the symlink target does not
      # exist — clone the public TarunvirBains/sassi repo into the
      # `sassi-reference/` slot so `path = "../sassi-reference/sassi"` in
      # `djogi/Cargo.toml` and `djogi-macros/Cargo.toml` resolves.
      #
      # Pinned to Sassi commit c143f373 because it includes the Lihaaf
      # fixture migration and external-field codegen API used by Djogi.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA; actions/checkout@v6 rejects short SHAs
          # unless the commit is reachable from the fetched refs.
          ref: c143f373c333876fa744e9aae6bd38881a8126c8
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract event text
        id: event_text
        shell: bash
        run: |
          set -euo pipefail

          file="$(mktemp)"
          issue_number=""
          {
            case "${{ github.event_name }}" in
              issues)
                issue_number="$(jq -r '.issue.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s\n' "$(jq -r '.issue.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              issue_comment)
                issue_number="$(jq -r '.issue.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_target)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s\n' "$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review_comment)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              *)
                issue_number=""
                printf ''
                ;;
            esac
          } > "$file"

          printf 'path=%s\n' "$file" >> "$GITHUB_OUTPUT"
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"

      # === Scanner step — NO `GITHUB_TOKEN` env ===
      #
      # Executes cargo + the Rust scanner from the trusted base-branch
      # checkout. Even though the code is trusted, this step is the only
      # arbitrary-code-execution surface in the workflow, so we keep the
      # token away from it. On success, persists a redacted scanner report
      # to a runner-local file and sets `has_findings` for the next step.
      - name: Scan text for obvious secrets
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          if ! [ -s "${{ steps.event_text.outputs.path }}" ]; then
            echo "No public text body payload was present; skipping."
            printf 'has_findings=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scanner_result=0
          scanner_output="$(cargo xtask check-secrets --stdin < "${{ steps.event_text.outputs.path }}" 2>&1)" || scanner_result=$?

          if [ "$scanner_result" -eq 0 ]; then
            echo "check-secrets: no findings"
            printf 'has_findings=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Persist the scanner output to a file so the comment-posting
          # step reads it directly — that step never re-runs scanner
          # code. `$RUNNER_TEMP` is always available on hosted runners.
          report_file="$RUNNER_TEMP/check-secrets-report.txt"
          printf '%s' "$scanner_output" > "$report_file"

          # Defense-in-depth shape validation of the scanner output.
          # The scanner is documented to emit only structural redactions
          # (`<stdin>:<line>: <kind>: ...`, `postgres://<REDACTED>@host`,
          # `KEY=<REDACTED N bytes>`) — never raw matched values. We add
          # two cheap checks on top:
          #   1. Size cap (16 KiB). A typical findings report is well
          #      under 1 KiB; a 16 KiB cap is generous for adversarial
          #      bodies with many lines while still bounding what reaches
          #      the comment-posting step.
          #   2. Printable-ASCII + standard whitespace only. Rejects
          #      accidental control characters, binary garbage, or shell
          #      escape sequences.
          # If either check fails we hard-fail the workflow BEFORE the
          # token-bearing step runs.
          report_bytes=$(wc -c < "$report_file")
          if [ "$report_bytes" -gt 16384 ]; then
            echo "check-secrets: scanner output exceeded 16 KiB ($report_bytes bytes); refusing to post."
            exit 1
          fi
          if LC_ALL=C grep -q '[^[:print:][:space:]]' "$report_file"; then
            echo "check-secrets: scanner output contained non-printable bytes; refusing to post."
            exit 1
          fi

          printf 'has_findings=true\n' >> "$GITHUB_OUTPUT"
          printf 'report_path=%s\n' "$report_file" >> "$GITHUB_OUTPUT"

      # === Comment-posting step — the ONLY step bound to `GITHUB_TOKEN` ===
      #
      # Reads the pre-validated, redacted scanner report and posts it to
      # the issue / PR. Performs no cargo / Rust / scanner work; runs only
      # `cat | jq | curl` against the GitHub REST API.
      - name: Post sanitized comment
        id: post_comment
        if: steps.scan.outputs.has_findings == 'true' && steps.event_text.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          report_file='${{ steps.scan.outputs.report_path }}'
          if ! [ -s "$report_file" ]; then
            echo "check-secrets: report file empty or missing; cannot post."
            exit 1
          fi
          scanner_output="$(cat "$report_file")"

          event_issue_number='${{ steps.event_text.outputs.issue_number }}'
          safe_event_name='${{ github.event_name }}'

          comment_body="$(printf '%s\n' \
            '🚫 Secret-hygiene guard found redacted potential credential-like findings.' \
            '' \
            'Do not paste raw secrets in issue/PR text.' \
            '' \
            "Event: \`$safe_event_name\`" \
            "Target: issue/PR #$event_issue_number" \
            '' \
            '```' \
            "$scanner_output" \
            '```')"
          comment_payload=$(jq -R -s '{body: .}' <<< "$comment_body")

          response_body="$(mktemp)"
          response_status="$(curl -sS -o "$response_body" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/issues/${event_issue_number}/comments" \
            -d "$comment_payload")"

          if [ "$response_status" -ne 201 ]; then
            echo "check-secrets: findings detected but the workflow could not post a sanitized comment."
            echo "Event: $safe_event_name"
            echo "Target issue/PR: #$event_issue_number"
            echo "GitHub API status: $response_status"
            echo "Sanitized scanner output:"
            printf '%s\n' "$scanner_output"
            echo "--- response ---"
            cat "$response_body" || true
            exit 1
          fi

          {
            echo "### Secret-hygiene guard findings (redacted)"
            echo
            echo "```"
            printf '%s\n' "$scanner_output"
            echo "```"
            echo
            echo "The posted comment is intentionally redacted and contains no raw values."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "check-secrets: findings detected; redacted warning comment posted."

      # Hard-fail gate. Runs even when the comment posted successfully so
      # the workflow status surfaces findings as a red ❌ on the PR /
      # issue check — a green check on a body with leaked credentials
      # would defeat the point of the guard. `always()` ensures we still
      # fail when the post step exited early (e.g. missing issue context
      # or a transient API failure).
      - name: Hard-fail on findings
        if: always() && steps.scan.outputs.has_findings == 'true'
        run: |
          echo "check-secrets: hard-failing because secret-hygiene findings were detected."
          exit 1
