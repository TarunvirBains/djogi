name: Public-text secret hygiene

# This workflow guards public-facing GitHub text (issue bodies, PR titles /
# bodies, review bodies, review-comment bodies) against credential-shaped
# strings before they go live. It runs the same `cargo xtask check-secrets
# --stdin` scanner that adopters use locally.
#
# === Security shape ===
#
# The scanner is Rust code; running it requires building from sources.
# Those sources, plus the entire `cargo` build path, must come from a
# *trusted* checkout — otherwise a malicious PR could replace
# `xtask/src/check_secrets.rs`, a build.rs, a workspace `Cargo.toml`
# dependency, etc., and execute arbitrary code with `GITHUB_TOKEN`
# privileges. The shape below is structured so that:
#
#   1. The workflow is split into TWO jobs:
#
#        scan             — performs all cargo / Rust scanner work. Has
#                           no write scopes anywhere, no `GITHUB_TOKEN`
#                           binding, persists no auth credentials in any
#                           `.git/config`, and explicitly pins every
#                           checkout `ref:` to the repository's default
#                           branch so untrusted PR code can never reach
#                           the cargo build path.
#
#        comment_and_fail — posts the sanitized comment (write scopes:
#                           `issues:write`, `pull-requests:write`) and
#                           hard-fails the workflow on findings. Performs
#                           NO `actions/checkout`, runs NO cargo / Rust /
#                           scanner code, and consumes only the redacted
#                           scanner report artifact produced by the
#                           scan job.
#
#      Splitting jobs is what enforces "the only step that ever sees a
#      write-scoped token is one that never touches Rust source." A
#      single-job design that bound the token to a later step is weaker
#      because earlier scanner / build steps share the runner with the
#      token-bearing step's environment.
#
#   2. Every checkout in the `scan` job pins an explicit trusted `ref:`.
#      Several PR-related triggers — notably `pull_request_review` and
#      `pull_request_review_comment` — can otherwise resolve to the PR
#      head merge ref via the default `GITHUB_REF`/`GITHUB_SHA`, which
#      `actions/checkout@v6` would then check out. Pinning every checkout
#      to `${{ github.event.repository.default_branch }}` (a field
#      present on every event payload the workflow consumes) guarantees
#      scanner sources always come from the protected default branch.
#
#   3. Every checkout in the `scan` job sets `persist-credentials: false`.
#      Without that, `actions/checkout@v6` writes a `GITHUB_TOKEN`
#      extraheader into `.git/config`, which any later script — even one
#      that "doesn't set GITHUB_TOKEN explicitly" — can use for
#      authenticated git operations. Stripping the persisted credentials
#      keeps the token off the runner disk entirely in the scan job.
#
#   4. The scan job validates the scanner report shape (size cap +
#      printable-ASCII-only) before uploading it as an artifact. The
#      scanner is documented to emit only structural redactions
#      (`<REDACTED>`, `<REDACTED N bytes>`, `<stdin>:<line>: <kind>:
#      ...`), but the cheap shape check is defence-in-depth: if scanner
#      output ever drifts into emitting raw matched values or control
#      bytes, the workflow fails *before* the artifact crosses into the
#      token-bearing job.
#
#   5. The workflow hard-fails on findings even when the comment posts
#      successfully — a green check on a body with leaked credentials
#      would defeat the point of the guard.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # `pull_request_target` (not `pull_request`) — runs in the base-branch
  # context. The PR's own commits do NOT execute here. See `Security
  # shape` above.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

# Top-level permissions: most restrictive default. Every job that needs
# writes must override at the job level.
permissions:
  contents: read

jobs:
  # === scan job — cargo / Rust execution surface ===
  #
  # Trusted-source scanner. Read-only scopes only; never sees
  # `GITHUB_TOKEN`. Outputs are limited to:
  #   - `has_findings` — `"true"` when the scanner emitted findings;
  #   - `issue_number` — the issue / PR number extracted from the event
  #     payload (or empty string when no comment target is available).
  # When findings are present, the scan job uploads the (already-redacted,
  # shape-validated) report as an artifact for the comment job to consume.
  scan:
    name: Scan public text for credential-shaped strings
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      has_findings: ${{ steps.scan.outputs.has_findings }}
      issue_number: ${{ steps.event_text.outputs.issue_number }}

    steps:
      # Trusted scanner checkout. The `ref:` is pinned explicitly to the
      # repository's default branch so every trigger gets the same trusted
      # code — including `pull_request_review` and
      # `pull_request_review_comment`, which can otherwise resolve to the
      # PR merge ref via the default `GITHUB_REF`/`GITHUB_SHA`.
      #
      # `persist-credentials: false` strips the `GITHUB_TOKEN` extraheader
      # from `.git/config`. The scan job has no write scopes and binds no
      # token to any step, but stripping the persisted credentials is
      # defense-in-depth — no future edit to this job can act as the
      # token via a `git push`.
      - name: Checkout djogi at trusted default-branch ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract event text
        id: event_text
        shell: bash
        run: |
          set -euo pipefail

          file="$(mktemp)"
          issue_number=""
          {
            case "${{ github.event_name }}" in
              issues)
                issue_number="$(jq -r '.issue.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s\n' "$(jq -r '.issue.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              issue_comment)
                issue_number="$(jq -r '.issue.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_target)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s\n' "$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review_comment)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              *)
                issue_number=""
                printf ''
                ;;
            esac
          } > "$file"

          printf 'path=%s\n' "$file" >> "$GITHUB_OUTPUT"
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"

      # === Scanner step — NO `GITHUB_TOKEN` env, no write scopes ===
      #
      # Executes cargo + the Rust scanner from the trusted default-branch
      # checkout. On findings, persists a redacted scanner report to a
      # runner-local file and sets `has_findings=true`. The companion
      # `comment_and_fail` job downloads the report as an artifact —
      # this step never has token access.
      - name: Scan text for obvious secrets
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          if ! [ -s "${{ steps.event_text.outputs.path }}" ]; then
            echo "No public text body payload was present; skipping."
            printf 'has_findings=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scanner_result=0
          scanner_output="$(cargo xtask check-secrets --stdin < "${{ steps.event_text.outputs.path }}" 2>&1)" || scanner_result=$?

          if [ "$scanner_result" -eq 0 ]; then
            echo "check-secrets: no findings"
            printf 'has_findings=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Persist the scanner output to a file so the comment job
          # consumes it via an artifact. `$RUNNER_TEMP` is always
          # available on hosted runners.
          report_file="$RUNNER_TEMP/check-secrets-report.txt"
          printf '%s' "$scanner_output" > "$report_file"

          # Defense-in-depth shape validation of the scanner output.
          # The scanner is documented to emit only structural redactions
          # (`<stdin>:<line>: <kind>: ...`, `postgres://<REDACTED>@host`,
          # `KEY=<REDACTED N bytes>`) — never raw matched values. We add
          # two cheap checks on top:
          #   1. Size cap (16 KiB). A typical findings report is well
          #      under 1 KiB; a 16 KiB cap is generous for adversarial
          #      bodies with many lines while still bounding what crosses
          #      into the token-bearing job.
          #   2. Printable-ASCII + standard whitespace only. Rejects
          #      accidental control characters, binary garbage, or shell
          #      escape sequences.
          # If either check fails we hard-fail the workflow BEFORE the
          # artifact is uploaded.
          report_bytes=$(wc -c < "$report_file")
          if [ "$report_bytes" -gt 16384 ]; then
            echo "check-secrets: scanner output exceeded 16 KiB ($report_bytes bytes); refusing to upload."
            exit 1
          fi
          if LC_ALL=C grep -q '[^[:print:][:space:]]' "$report_file"; then
            echo "check-secrets: scanner output contained non-printable bytes; refusing to upload."
            exit 1
          fi

          printf 'has_findings=true\n' >> "$GITHUB_OUTPUT"
          printf 'report_path=%s\n' "$report_file" >> "$GITHUB_OUTPUT"

      # Upload the redacted, shape-validated scanner report as an
      # artifact so the comment job — which has no checkout, no cargo,
      # no Rust execution — can consume it. Skipped when no findings.
      - name: Upload redacted scanner report
        if: steps.scan.outputs.has_findings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: check-secrets-report
          path: ${{ steps.scan.outputs.report_path }}
          if-no-files-found: error
          retention-days: 1

  # === comment_and_fail job — narrow write scope, NO source / cargo ===
  #
  # Posts the sanitized comment (when an issue / PR target is available)
  # and hard-fails the workflow on findings. Runs only when the scan job
  # reported findings. Performs no checkout — and therefore no cargo /
  # Rust execution — so the only path the write-scoped token sees is
  # `cat | jq | curl` against the GitHub REST API. Consumes only the
  # already-redacted, already-shape-validated scanner report uploaded by
  # the scan job.
  comment_and_fail:
    name: Post sanitized comment and hard-fail on findings
    needs: scan
    if: needs.scan.outputs.has_findings == 'true'
    runs-on: ubuntu-latest
    # Minimal write scopes — only what the curl POST to
    # /repos/.../issues/{n}/comments needs, plus `actions: read` to pull
    # the artifact down from the scan job.
    permissions:
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Download redacted scanner report
        uses: actions/download-artifact@v4
        with:
          name: check-secrets-report
          path: ${{ runner.temp }}

      # Comment-posting step — the ONLY step bound to `GITHUB_TOKEN`.
      # Reads the pre-validated, redacted scanner report and posts it via
      # `cat | jq | curl`. Skipped when there is no issue / PR target;
      # the hard-fail step below still runs.
      - name: Post sanitized comment
        id: post_comment
        if: needs.scan.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          report_file="$RUNNER_TEMP/check-secrets-report.txt"
          if ! [ -s "$report_file" ]; then
            echo "check-secrets: report file empty or missing; cannot post."
            exit 1
          fi
          scanner_output="$(cat "$report_file")"

          event_issue_number='${{ needs.scan.outputs.issue_number }}'
          safe_event_name='${{ github.event_name }}'

          comment_body="$(printf '%s\n' \
            '🚫 Secret-hygiene guard found redacted potential credential-like findings.' \
            '' \
            'Do not paste raw secrets in issue/PR text.' \
            '' \
            "Event: \`$safe_event_name\`" \
            "Target: issue/PR #$event_issue_number" \
            '' \
            '```' \
            "$scanner_output" \
            '```')"
          comment_payload=$(jq -R -s '{body: .}' <<< "$comment_body")

          response_body="$(mktemp)"
          response_status="$(curl -sS -o "$response_body" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/issues/${event_issue_number}/comments" \
            -d "$comment_payload")"

          if [ "$response_status" -ne 201 ]; then
            echo "check-secrets: findings detected but the workflow could not post a sanitized comment."
            echo "Event: $safe_event_name"
            echo "Target issue/PR: #$event_issue_number"
            echo "GitHub API status: $response_status"
            echo "Sanitized scanner output:"
            printf '%s\n' "$scanner_output"
            echo "--- response ---"
            cat "$response_body" || true
            exit 1
          fi

          {
            echo "### Secret-hygiene guard findings (redacted)"
            echo
            echo "```"
            printf '%s\n' "$scanner_output"
            echo "```"
            echo
            echo "The posted comment is intentionally redacted and contains no raw values."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "check-secrets: findings detected; redacted warning comment posted."

      # Hard-fail gate. Runs even when the previous comment step exited
      # early (no issue target, transient API failure, etc.) so the
      # workflow status surfaces findings as a red ❌ on the PR / issue
      # check — a green check on a body with leaked credentials would
      # defeat the point of the guard.
      - name: Hard-fail on findings
        if: always()
        run: |
          echo "check-secrets: hard-failing because secret-hygiene findings were detected."
          exit 1
