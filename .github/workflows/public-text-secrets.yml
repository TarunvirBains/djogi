name: Public-text secret hygiene

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  guard:
    name: Check public GitHub text
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract event text
        id: event_text
        shell: bash
        run: |
          set -euo pipefail

          file="$(mktemp)"
          {
            case "${{ github.event_name }}" in
              issues)
                printf '%s\n' "$(jq -r '.issue.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              issue_comment)
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request)
                printf '%s\n' "$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review)
                printf '%s' "$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review_comment)
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              *)
                printf ''
                ;;
            esac
          } > "$file"

          printf 'path=%s\n' "$file" >> "$GITHUB_OUTPUT"

      - name: Scan text for obvious secrets
        run: |
          set -euo pipefail
          if ! [ -s "${{ steps.event_text.outputs.path }}" ]; then
            echo "No public text body payload was present; skipping."
            exit 0
          fi
          cargo xtask check-secrets --stdin < "${{ steps.event_text.outputs.path }}"
