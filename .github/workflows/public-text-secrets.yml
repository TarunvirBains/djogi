name: Public-text secret hygiene

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard:
    name: Check public GitHub text
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      # `sassi-reference` is a path-dep symlink in local dev (points at the
      # sister `~/projects/sassi` workspace so cargo picks up uncommitted
      # `sassi` changes immediately). On GHA the symlink target does not
      # exist — clone the public TarunvirBains/sassi repo into the
      # `sassi-reference/` slot so `path = "../sassi-reference/sassi"` in
      # `djogi/Cargo.toml` and `djogi-macros/Cargo.toml` resolves.
      #
      # Pinned to Sassi commit c143f373 because it includes the Lihaaf
      # fixture migration and external-field codegen API used by Djogi.
      - name: Checkout sassi sister repo
        uses: actions/checkout@v6
        with:
          repository: TarunvirBains/sassi
          # Full 40-character SHA; actions/checkout@v6 rejects short SHAs
          # unless the commit is reachable from the fetched refs.
          ref: c143f373c333876fa744e9aae6bd38881a8126c8
          path: sassi-reference
          # SHA pinning requires a full fetch — actions/checkout@v6
          # defaults to `fetch-depth: 1`, which only fetches named
          # refs. Drop to a full clone so the SHA resolves.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract event text
        id: event_text
        shell: bash
        run: |
          set -euo pipefail

          file="$(mktemp)"
          issue_number=""
          {
            case "${{ github.event_name }}" in
              issues)
                issue_number="$(jq -r '.issue.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s\n' "$(jq -r '.issue.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              issue_comment)
                issue_number="$(jq -r '.issue.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s\n' "$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              pull_request_review_comment)
                issue_number="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH")"
                printf '%s' "$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
                ;;
              *)
                issue_number=""
                printf ''
                ;;
            esac
          } > "$file"

          printf 'path=%s\n' "$file" >> "$GITHUB_OUTPUT"
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"

      - name: Scan text for obvious secrets
        run: |
          set -euo pipefail
          if ! [ -s "${{ steps.event_text.outputs.path }}" ]; then
            echo "No public text body payload was present; skipping."
            exit 0
          fi

          event_issue_number='${{ steps.event_text.outputs.issue_number }}'
          scanner_result=0
          scanner_output="$(cargo xtask check-secrets --stdin < "${{ steps.event_text.outputs.path }}" 2>&1)" || scanner_result=$?

          if [ "$scanner_result" -eq 0 ]; then
            echo "check-secrets: no findings"
            exit 0
          fi

          if [ -z "$event_issue_number" ] || [ "$event_issue_number" = "null" ]; then
            echo "check-secrets: findings detected, but no comment target was available."
            printf '%s\n' "$scanner_output"
            exit 1
          fi

          safe_event_name='${{ github.event_name }}'
          comment_body="$(printf '%s\n' \
            '🚫 Secret-hygiene guard found redacted potential credential-like findings.' \
            '' \
            'Do not paste raw secrets in issue/PR text.' \
            '' \
            "Event: \`$safe_event_name\`" \
            "Target: issue/PR #$event_issue_number" \
            '' \
            '```' \
            "$scanner_output" \
            '```')"
          comment_payload=$(jq -R -s '{body: .}' <<< "$comment_body")

          response_body="$(mktemp)"
          response_status="$(curl -sS -o "$response_body" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/issues/${event_issue_number}/comments" \
            -d "$comment_payload")"

          if [ "$response_status" -ne 201 ]; then
            echo "check-secrets: findings detected but the workflow could not post a sanitized comment."
            echo "Event: $safe_event_name"
            echo "Target issue/PR: #$event_issue_number"
            echo "GitHub API status: $response_status"
            echo "Sanitized scanner output:"
            printf '%s\n' "$scanner_output"
            echo "--- response ---"
            cat "$response_body" || true
            exit 1
          fi

          {
            echo "### Secret-hygiene guard findings (redacted)"
            echo
            echo "```"
            printf '%s\n' "$scanner_output"
            echo "```"
            echo
            echo "The posted comment is intentionally redacted and contains no raw values."
          } >> "$GITHUB_STEP_SUMMARY"
